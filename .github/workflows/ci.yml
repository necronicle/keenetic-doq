name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test ./...
      - run: sh scripts/test-install-migrate.sh
      - name: shell scripts
        run: |
          shellcheck -s sh -S warning install.sh uninstall.sh install-openwrt.sh uninstall-openwrt.sh scripts/*.sh
          sh scripts/test-install-openwrt.sh
      - name: cross-build all router arches
        run: sh scripts/build-all.sh /tmp/dist
